<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>faBludar</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: { extend: { colors: { brand: { 50: '#eff6ff', 500: '#3b82f6', 600: '#2563eb', 700: '#1d4ed8' } }, fontFamily: { sans: ['Inter', 'sans-serif'] } } }
    }
  </script>
  <style>
    body { background-color: #e2e8f0; user-select: none; }
    @keyframes radar-sweep { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    .radar-sweeper { animation: radar-sweep 4s linear infinite; transform-origin: center center; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-0 md:p-4">

  <!-- Mobile Phone Container -->
  <div class="relative w-full max-w-md h-[100vh] md:h-[880px] bg-slate-50 md:rounded-[44px] shadow-2xl overflow-hidden flex flex-col border-0 md:border-[8px] border-slate-800">
    
    <!-- Header -->
    <header class="bg-white/80 backdrop-blur-md px-5 py-3 border-b border-slate-100 flex items-center justify-between z-30">
      <div class="flex items-center gap-2">
        <div class="w-8 h-8 rounded-xl bg-brand-600 text-white flex items-center justify-center font-bold">
          <i class="fa-solid fa-tower-broadcast"></i>
        </div>
        <div>
          <h1 class="text-lg font-bold text-slate-800 leading-none">faBludar</h1>
          <span class="text-[10px] font-medium text-brand-600 bg-brand-50 px-1.5 py-0.5 rounded-full mt-1 inline-block" id="connection-status">
            <i class="fa-bluetooth fa-brands mr-1"></i>Connecting...
          </span>
        </div>
      </div>
    </header>

    <!-- Main Content (Radar Page) -->
    <main class="flex-1 overflow-y-auto p-4 space-y-4">
      
      <!-- Radar -->
      <div class="bg-white border border-slate-100 rounded-3xl p-5 shadow-sm text-center">
        <div class="flex items-center justify-between mb-3">
          <span class="text-xs font-semibold text-slate-400 uppercase">Nearby Radar</span>
          <span class="text-xs font-medium text-brand-600 bg-brand-50 px-2.5 py-1 rounded-full" id="peer-count">0 Peers</span>
        </div>

        <div class="relative w-64 h-64 mx-auto my-2 rounded-full border border-brand-100 bg-slate-50 flex items-center justify-center overflow-hidden" id="radar-container">
          <div class="absolute w-48 h-48 rounded-full border border-brand-200/50"></div>
          <div class="absolute w-32 h-32 rounded-full border border-brand-200/60"></div>
          <div class="absolute w-16 h-16 rounded-full border border-brand-300/80"></div>
          
          <div class="absolute w-full h-full radar-sweeper pointer-events-none">
            <div class="w-1/2 h-1/2 bg-gradient-to-br from-brand-400/25 to-transparent origin-bottom-right rounded-tl-full"></div>
          </div>
          
          <div class="w-4 h-4 rounded-full bg-brand-600 border-2 border-white shadow-md z-10"></div>
        </div>
        <p class="text-xs text-slate-500">Scanning for offline peers...</p>
      </div>

      <!-- Chat -->
      <div class="bg-white rounded-3xl border border-slate-100 shadow-sm flex flex-col h-64">
        <div class="p-3 border-b border-slate-100 bg-slate-50 rounded-t-3xl flex justify-between items-center">
          <h3 class="text-sm font-bold text-slate-800">Mesh Chat</h3>
          <span class="text-[10px] bg-brand-100 text-brand-700 px-2 py-0.5 rounded-full font-bold">Live</span>
        </div>
        <div class="flex-1 p-3 overflow-y-auto space-y-2 no-scrollbar" id="chat-messages-box">
          <div class="text-center text-[10px] text-slate-400 bg-slate-100 rounded-full py-1 px-3 inline-block mx-auto w-max block">Connected to WebRTC Mesh</div>
        </div>
        <div class="p-2 border-t flex gap-2">
          <input type="text" id="chat-input" placeholder="Type a message..." class="flex-1 bg-slate-100 rounded-full px-4 py-2 text-xs outline-none">
          <button id="send-btn" class="bg-brand-600 text-white w-8 h-8 rounded-full flex items-center justify-center"><i class="fa-solid fa-paper-plane text-[10px]"></i></button>
        </div>
      </div>
    </main>
  </div>

  <!-- Load the App -->
  <script type="module" src="./app.js"></script>
</body>
</html>
